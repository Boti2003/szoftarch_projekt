server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Publikus API route-ok a domain service-ek felé (D08).
            # A /internal/** SOHA nincs route-olva (8. szakasz).
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/leaderboard/**,/api/v1/leaderboards/**
            - id: learning
              uri: ${LEARNING_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/languages/**,/api/v1/learning/**,/api/v1/lessons/**,/api/v1/exercises/**,/api/v1/daily-challenges/**,/api/v1/ai-scenarios/**
            - id: social
              uri: ${SOCIAL_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/friend-requests/**,/api/v1/friends/**,/api/v1/leaderboards/friends,/api/v1/duels/**,/api/v1/notifications/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGIN:https://localhost}
                allowed-methods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
                allowed-headers: '*'
                allow-credentials: true

# Belső service URL-ek a system health aggregációhoz (skeleton health dashboard).
gateway:
  downstream:
    identity: ${IDENTITY_URL:http://localhost:8081}
    learning: ${LEARNING_URL:http://localhost:8082}
    social: ${SOCIAL_URL:http://localhost:8083}
    ai: ${AI_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
