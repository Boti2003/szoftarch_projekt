openapi: 3.1.0
info:
  title: Learning Service API
  version: 0.0.1
  description: >
    Nyelvek, leckék, feladatok, progress, napi kihívás, AI-workflow orkesztráció
    és belső duel-set API (TERV 7.4, 7.5). Váz: endpointok + hibaséma rögzítve.
servers:
  - url: /api/v1
  - url: /internal/v1

tags:
  - name: languages
  - name: lessons
  - name: exercises
  - name: daily
  - name: ai-scenarios
  - name: internal

paths:
  /languages:
    get: { tags: [languages], summary: Elérhető nyelvek, responses: { '200': { description: OK } } }
  /learning/enrollments:
    get: { tags: [languages], summary: Saját tanult nyelvek és aktív nyelv, responses: { '200': { description: OK } } }
  /learning/enrollments/{languageId}/active:
    put:
      tags: [languages]
      summary: Nyelv felvétele/aktiválása
      parameters: [{ name: languageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /languages/{languageId}/lessons:
    get:
      tags: [lessons]
      summary: Sorrendezett leckék saját státusszal
      parameters: [{ name: languageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /lessons/{lessonId}:
    get:
      tags: [lessons]
      summary: Elmélet és feladatok metaadata
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Problem' } }
  /exercises/{exerciseId}:
    get:
      tags: [exercises]
      summary: Feladat prezentáció helyes megoldás nélkül
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /exercises/{exerciseId}/attempts:
    post:
      tags: [exercises]
      summary: Automatikus vagy translation válasz beküldése (Idempotency-Key)
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Kiértékelve }, '400': { $ref: '#/components/responses/Problem' } }
  /learning/progress/summary:
    get: { tags: [lessons], summary: Teljesített leckék és aktív nyelv összesítő, responses: { '200': { description: OK } } }
  /daily-challenges/today:
    get:
      tags: [daily]
      summary: Napi feladatsor és saját státusz
      parameters: [{ name: languageId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /daily-challenges/today/exercises/{exerciseId}/attempts:
    post:
      tags: [daily]
      summary: Napi válasz beküldése
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /ai-scenarios/{exerciseId}/sessions:
    post:
      tags: [ai-scenarios]
      summary: Learning attempt + belső AI session indítása
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: Létrehozva }, '502': { $ref: '#/components/responses/Problem' } }
  /ai-scenarios/sessions/{sessionId}/messages:
    post:
      tags: [ai-scenarios]
      summary: Felhasználói üzenet, AI-válasz
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK }, '502': { $ref: '#/components/responses/Problem' } }
  /ai-scenarios/sessions/{sessionId}/complete:
    post:
      tags: [ai-scenarios]
      summary: Záróértékelés, progress és pont
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }

  /duel-sets:
    post:
      tags: [internal]
      servers: [{ url: /internal/v1 }]
      summary: 5 feladatból álló készlet létrehozása (Social hívja)
      description: >
        Belső végpont; kizárólag X-Internal-Api-Key headerrel érhető el (a
        Gateway nem route-olja). Idempotens a duelId-re: ugyanarra a duelId-re
        ismételt hívás a meglévő készletet adja vissza. NINCS JWT user-kontextus.
      parameters:
        - { name: X-Internal-Api-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDuelSetRequest' }
      responses:
        '201':
          description: Létrehozva vagy meglévő készlet (idempotens)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuelSetResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /duel-sets/{setId}:
    get:
      tags: [internal]
      servers: [{ url: /internal/v1 }]
      summary: Feladatprezentációk megoldás nélkül
      description: >
        Belső végpont; X-Internal-Api-Key szükséges. A készlet feladat-
        prezentációi MEGOLDÁS NÉLKÜL, pozíció sorrendben.
      parameters:
        - { name: setId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Internal-Api-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuelSetResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /duel-sets/{setId}/answers:
    post:
      tags: [internal]
      servers: [{ url: /internal/v1 }]
      summary: Egy résztvevő egy válaszának idempotens pontozása
      description: >
        Belső végpont; X-Internal-Api-Key szükséges. A userId a payloadból jön
        (nem JWT). Idempotens a (setId, userId, position) hármasra: helyes válasz
        az exercise max_points-ot, hibás 0-t kap. A párbaj pontja NEM profilpont;
        ez a végpont SOHA nem kezdeményez Identity pontjóváírást.
      parameters:
        - { name: setId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Internal-Api-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuelAnswerRequest' }
      responses:
        '200':
          description: Pontozva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuelAnswerResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
    CreateDuelSetRequest:
      type: object
      required: [duelId, languageId]
      properties:
        duelId: { type: string, format: uuid, description: Social párbaj UUID (external_duel_id, egyedi) }
        languageId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time, nullable: true, description: Opcionális lejárat }
    DuelSetResponse:
      type: object
      required: [setId, exercises]
      properties:
        setId: { type: string, format: uuid }
        exercises:
          type: array
          description: Feladatprezentációk pozíció sorrendben, MEGOLDÁS NÉLKÜL
          items: { $ref: '#/components/schemas/ExercisePresentation' }
    ExercisePresentation:
      type: object
      description: Egy feladat prezentációja megoldás nélkül (típusfüggő content).
      properties:
        exerciseId: { type: string, format: uuid }
        type: { type: string }
        difficulty: { type: string }
        prompt: { type: string }
        maxPoints: { type: integer }
        requiredForCompletion: { type: boolean }
        duelEligible: { type: boolean }
        content: { type: object, description: Típusfüggő prezentációs tartalom, solution nélkül }
    DuelAnswerRequest:
      type: object
      required: [userId, position, answer]
      properties:
        userId: { type: string, format: uuid, description: A résztvevő azonosítója (a Socialtól, nem JWT) }
        position: { type: integer, description: A feladat pozíciója a mentett készletben }
        answer: { type: object, description: A feladattípushoz tartozó nyers válasz JSON }
    DuelAnswerResponse:
      type: object
      required: [position, score, correct]
      properties:
        position: { type: integer }
        score: { type: integer, description: Helyes -> exercise max_points, egyébként 0 (NEM profilpont) }
        correct: { type: boolean }

security:
  - bearerAuth: []
