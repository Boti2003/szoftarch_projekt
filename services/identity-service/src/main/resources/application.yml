server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${IDENTITY_DB_NAME:identity_db}
    username: ${IDENTITY_DB_USER:identity_user}
    password: ${IDENTITY_DB_PASSWORD:change-me-identity}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

jwt:
  issuer: ${JWT_ISSUER:szoftarch-nyelvtanulo}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:300}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:secrets/jwt-private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:secrets/jwt-public.pem}

internal:
  api-key: ${INTERNAL_API_KEY:change-me-at-least-32-bytes-random-value}
