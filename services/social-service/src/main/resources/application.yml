server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: social-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${SOCIAL_DB_NAME:social_db}
    username: ${SOCIAL_DB_USER:social_user}
    password: ${SOCIAL_DB_PASSWORD:change-me-social}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
