spring:
  datasource:
    url: jdbc:h2:mem:social;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

# RS256 public key for the resource-server decoder in full-context tests
# (slice/security tests mock the JwtDecoder; this satisfies the others).
social:
  security:
    jwt:
      public-key: classpath:keys/jwt-public-test.pub
