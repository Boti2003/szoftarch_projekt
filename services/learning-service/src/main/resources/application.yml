server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${LEARNING_DB_NAME:learning_db}
    username: ${LEARNING_DB_USER:learning_user}
    password: ${LEARNING_DB_PASSWORD:change-me-learning}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
