server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AI_DB_NAME:ai_db}
    username: ${AI_DB_USER:ai_user}
    password: ${AI_DB_PASSWORD:change-me-ai}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
