server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AI_DB_NAME:ai_db}
    username: ${AI_DB_USER:ai_user}
    password: ${AI_DB_PASSWORD:change-me-ai}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Nyelvi modell provider (fake | openai-compatible). A fake kulcs nélkül fut.
ai:
  provider: ${AI_PROVIDER:fake}
  openai:
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_OPENAI_API_KEY:}
    model: ${AI_OPENAI_MODEL:gpt-4o-mini}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:20}


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
