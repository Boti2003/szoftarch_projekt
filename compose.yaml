# =========================================================================
# KĂ¶zĂ¶ssĂ©gi nyelvtanulĂł â€“ egyparancsos indĂ­tĂˇs (D16).
#   cp .env.example .env
#   docker compose up --build
# Csak az Nginx 443 portja publikus (D13 / 3.2). A service-ek Ă©s a DB
# a belsĹ‘ 'backend' hĂˇlĂłzaton maradnak.
# =========================================================================

name: nyelvtanulo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Az init scriptnek Ăˇtadott service-credentialek:
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      LEARNING_DB_NAME: ${LEARNING_DB_NAME}
      LEARNING_DB_USER: ${LEARNING_DB_USER}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD}
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD}
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  learning-service:
    build:
      context: .
      dockerfile: services/learning-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LEARNING_DB_NAME: ${LEARNING_DB_NAME}
      LEARNING_DB_USER: ${LEARNING_DB_USER}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      IDENTITY_URL: http://identity-service:8080
      AI_URL: http://ai-service:8080
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE}
      JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt-public.pem
    volumes:
      # Least privilege: a nem-Identity service-ek CSAK a publikus kulcsot kapják
      # (az aláírás ellenőrzéséhez). A privát kulcs kizárólag az Identity-é.
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  social-service:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
    # Dev/demo only: expose the service directly so Swagger UI is reachable at
    # http://localhost:8083/swagger-ui.html (nginx only routes /api/). Remove
    # or comment out for a production-like run where only nginx :443 is public.
    ports:
      - "8083:8080"
    environment:
      # Optional Spring profile passthrough from the host shell. Unset = secure
      # default profile. Prefix the up command with SPRING_PROFILES_ACTIVE=dev
      # to enable the permit-all dev profile (dev/demo only, NEVER in prod).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      IDENTITY_URL: http://identity-service:8080
      # Social reads Identity internal API base from IDENTITY_INTERNAL_BASE_URL
      # (the adapter default is localhost:8081, wrong inside the container).
      IDENTITY_INTERNAL_BASE_URL: http://identity-service:8080
      LEARNING_URL: http://learning-service:8080
      # RS256 public key for JWT validation (shared secret; Identity holds the private key).
      JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER}
    volumes:
      # Least privilege: only the PUBLIC key is mounted for signature checking.
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      IDENTITY_URL: http://identity-service:8080
      LEARNING_URL: http://learning-service:8080
      SOCIAL_URL: http://social-service:8080
      AI_URL: http://ai-service:8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    depends_on:
      identity-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge

